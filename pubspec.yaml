name: handzythozhan
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:   
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  geolocator: ^12.0.0
  geocoding: ^5.0.0
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.5
  firebase_core: ^4.13.0
  video_player: ^2.9.5
  firebase_auth: ^6.5.7
  http: ^1.6.0
  android_intent_plus: 5.3.1
  cloud_firestore: ^6.8.0
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/image/handzy_thozhan_logo.png
    - assets/animations/worker_ready.mp4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/image/handzy_thozhan_logo.png"